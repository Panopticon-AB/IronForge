name: "🛡️ Governance Guard"

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/pr-e2e-trust-boundary.test.mjs'
      - 'playwright.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-workflows:
    name: Audit Workflow Standards
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PR E2E trust boundary
        run: node --test scripts/ci/pr-e2e-trust-boundary.test.mjs

      - name: Check Node and pnpm Versions
        shell: bash
        run: |
          echo "### 🛡️ Workflow Governance Audit" >> "$GITHUB_STEP_SUMMARY"
          ERRORS=0

          for file in .github/workflows/*.yml; do
            # Skip itself and specialized workflows that don't use Node standard runners.
            if [[ "$file" == *"/governance-guard.yml" || "$file" == *"/labeler.yml" || "$file" == *"/release-drafter.yml" || "$file" == *"/stale.yml" || "$file" == *"/scorecard.yml" || "$file" == *"/project-automation.yml" || "$file" == *"/dependabot-auto-merge.yml" || "$file" == *"/runner-heartbeat.yml" || "$file" == *"/ethicalcheck.yml" ]]; then continue; fi

            echo "Auditing $file..."

            if ! grep -qiE "node-version: ['\"]?22['\"]?|NODE_VERSION: ['\"]?22['\"]?|setup-ironforge" "$file"; then
              echo "❌ $file: Missing node-version: 22 standardization" >> "$GITHUB_STEP_SUMMARY"
              ERRORS=$((ERRORS + 1))
            fi

            if ! grep -qE "version: ['\"]?10['\"]?|setup-ironforge" "$file"; then
              if grep -q "pnpm/action-setup" "$file"; then
                echo "❌ $file: Uses pnpm but not version 10" >> "$GITHUB_STEP_SUMMARY"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            if grep -q "actions/checkout@v" "$file" && ! grep -qE "actions/checkout@v[4-9]" "$file"; then
              echo "❌ $file: Uses outdated checkout action (use @v4+ or immutable SHA)" >> "$GITHUB_STEP_SUMMARY"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Found $ERRORS governance violations. Please fix them to match IronForge standards." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ All workflows meet Titan-Tier standards." >> "$GITHUB_STEP_SUMMARY"
