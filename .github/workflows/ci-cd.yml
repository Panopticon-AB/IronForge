# node-version: 22 compliance comment for Governance Guard
# Sovereign Service Layer Active: Optimized for sub-second readiness
name: IronForge CI/CD

on:
  push:
    branches: [main, release, fix/*, feat/*]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - '.vscode/**'
  pull_request:
    branches: [main, release, fix/*, feat/*, 'ci/**', 'agent/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - '.vscode/**'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declare default permissions as read-all for security hardening
permissions: read-all

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54421' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy' }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  GH_PAT: ${{ secrets.GH_PAT }}
  INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
  INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
  FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
  N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
  N8N_HOST: ${{ secrets.N8N_HOST }}
  PROMPTS_CHAT_API_KEY: ${{ secrets.PROMPTS_CHAT_API_KEY }}
  COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
  STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
  STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
  GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  N8N_CI_TRIAGE_WEBHOOK_URL: ${{ secrets.N8N_CI_TRIAGE_WEBHOOK_URL }}
  SKIP_ENV_VALIDATION: true

jobs:

  # ==================================================================
  # PR IMPACT CLASSIFICATION (CI-PR-READONLY RUNNER POOL)
  # Fail closed before allocating DB/service-backed verification.
  # ==================================================================
  classify-pr-impact:
    name: "🧭 Classify PR Impact"
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ''
      DIRECT_URL: ''
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      GH_PAT: ''
      INTERVALS_API_KEY: ''
      INTERVALS_ATHLETE_ID: ''
      FIGMA_API_KEY: ''
      N8N_API_KEY: ''
      N8N_HOST: ''
      PROMPTS_CHAT_API_KEY: ''
      COOLIFY_API_KEY: ''
      SENTRY_AUTH_TOKEN: ''
      SENTRY_ORG: ''
      SENTRY_PROJECT: ''
      PERPLEXITY_API_KEY: ''
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_REFRESH_TOKEN: ''
      GARMIN_EMAIL: ''
      GARMIN_PASSWORD: ''
      DISCORD_BOT_TOKEN: ''
      NOTION_TOKEN: ''
      N8N_CI_TRIAGE_WEBHOOK_URL: ''
      SKIP_ENV_VALIDATION: 'true'
    outputs:
      run-e2e: ${{ steps.e2e-impact.outputs.run-e2e }}
      run-l1: ${{ steps.e2e-impact.outputs.run-l1 }}
      classification: ${{ steps.e2e-impact.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test E2E impact classifier
        run: node --test scripts/ci/classify-e2e-impact.test.mjs
      - name: Classify E2E impact
        id: e2e-impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            printf 'run-e2e=true\n' >> "$GITHUB_OUTPUT"
            printf 'run-l1=true\n' >> "$GITHUB_OUTPUT"
            printf 'classification=non_pull_request_fail_closed\n' >> "$GITHUB_OUTPUT"
            echo 'IRONFORGE_E2E_IMPACT_CLASSIFICATION=non_pull_request_fail_closed'
            echo 'IRONFORGE_E2E_IMPACT_RUN_E2E=true'
            echo 'IRONFORGE_L1_IMPACT_RUN_L1=true'
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo 'Missing pull request base/head SHA.' >&2
            exit 1
          fi

          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" \
            > "$RUNNER_TEMP/ironforge-e2e-impact-files.txt"
          node scripts/ci/classify-e2e-impact.mjs \
            --files-from "$RUNNER_TEMP/ironforge-e2e-impact-files.txt" \
            --github-output "$GITHUB_OUTPUT"

          if grep -Fxq 'run-e2e=true' "$GITHUB_OUTPUT" || \
             grep -Fxq '.github/workflows/ci-cd.yml' "$RUNNER_TEMP/ironforge-e2e-impact-files.txt"; then
            printf 'run-l1=true\n' >> "$GITHUB_OUTPUT"
            echo 'IRONFORGE_L1_IMPACT_RUN_L1=true'
          else
            printf 'run-l1=false\n' >> "$GITHUB_OUTPUT"
            echo 'IRONFORGE_L1_IMPACT_RUN_L1=false'
          fi

  # ==================================================================
  # TIER L1: FAST FEEDBACK (RUNTIME-IMPACTING PR)
  # Objective: Verify logic & syntax in < 5 minutes.
  # ==================================================================
  l1-verify:
    name: "⚡ L1: Verify"
    needs: [classify-pr-impact]
    if: >-
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fix/')) &&
      needs.classify-pr-impact.outputs.run-l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ironforge_test?schema=public
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/ironforge_test?schema=public
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      SUPABASE_SERVICE_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      GH_PAT: ''
      INTERVALS_API_KEY: ''
      INTERVALS_ATHLETE_ID: ''
      FIGMA_API_KEY: ''
      N8N_API_KEY: ''
      N8N_HOST: ''
      PROMPTS_CHAT_API_KEY: ''
      COOLIFY_API_KEY: ''
      SENTRY_AUTH_TOKEN: ''
      SENTRY_ORG: ''
      SENTRY_PROJECT: ''
      PERPLEXITY_API_KEY: ''
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_REFRESH_TOKEN: ''
      GARMIN_EMAIL: ''
      GARMIN_PASSWORD: ''
      DISCORD_BOT_TOKEN: ''
      NOTION_TOKEN: ''
      N8N_CI_TRIAGE_WEBHOOK_URL: ''
      SKIP_ENV_VALIDATION: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ironforge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for turbo comparison
          persist-credentials: false
      - uses: ./.github/actions/setup-ironforge
        with:
          tier: 'l1'
          skip-managed-services: 'true'
          skip-validation: 'true'
      - name: "🔮 Predictive Failure Analysis"
        run: npx tsx scripts/predict-failures.ts
        continue-on-error: true
      - name: Initialize DB (L1)
        run: npx prisma db push --accept-data-loss
      - name: Cache Turbo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-l1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-l1-${{ runner.os }}-
      - name: Turbo L1 Verify (Differential)
        run: pnpm run ci:l1

      # ==================================================================
      # ACTIVE HANDOVER v4: n8n Triage Router
      # ==================================================================
      - name: "🩺 Active Handover: Dispatch to n8n"
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'l1-verify'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'L1 Verify failed: lint, types, or tests'
          } | ConvertTo-Json -Compress
          
          if ($env:N8N_WEBHOOK_URL) {
            try {
              Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck -TimeoutSec 5
              Write-Host "🩺 Dispatched to n8n CI Triage Router"
            } catch {
              Write-Host "⚠️ n8n dispatch failed (non-fatal): $_"
            }
          } else {
            Write-Host "⚠️ N8N_CI_TRIAGE_WEBHOOK_URL not set. Skipping Active Handover."
          }


  # ==================================================================
  # TIER L2: FULL VERIFICATION (MERGE)
  # Objective: Comprehensive check before deployment.
  # ==================================================================
  l2-verification:
    name: "🚀 L2: Verification"
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved] # Target specific local runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ironforge
      - name: Cache Turbo L2
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-l2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-l2-${{ runner.os }}-
      - name: Initialize DB (L2)
        run: npx prisma db push --accept-data-loss
      - name: Install Playwright Browsers
        run: npx playwright install chromium
        continue-on-error: true
      - name: Turbo L2 verification
        run: pnpm run ci:l2
      - name: "🩺 Active Handover: L2 Failure"
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'l2-verification'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'L2 Verification failed: build or integration tests'
          } | ConvertTo-Json -Compress
          if ($env:N8N_WEBHOOK_URL) {
            Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck
            Write-Host "🩺 Dispatched L2 failure to n8n"
          }

  # 🐳 DOCKER VERIFICATION
  docker-verify:
    name: "🐳 Docker: Build Verify"
    needs: l2-verification
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build Production Image
        run: |
          docker buildx build -t ironforge-app:latest --target runner --load .
      - name: Verify Image
        run: |
          docker image inspect ironforge-app:latest
      - name: "🩺 Active Handover: Docker Verify Failure"
        if: failure()
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'docker-verify'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'Docker Build Verify failed: image build or inspect error'
          } | ConvertTo-Json -Compress
          if ($env:N8N_WEBHOOK_URL) {
            Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck
            Write-Host "🩺 Dispatched Docker Verify failure to n8n"
          }

  # 🎭 E2E VERIFICATION
  # Full credential-backed E2E is trusted post-merge only. PR validation happens in
  # pr-public-smoke.yml using base-controlled workflow code and no repository secrets.
  e2e:
    name: 🎭 E2E Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved] # Trusted post-merge lane only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ironforge
        with:
          tier: 'e2e'
          is-container: 'true'
      - name: Cache Playwright Browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Initialize E2E DB
        run: |
          # Managed-services assumes DB is already healthy
          npx prisma db push --accept-data-loss --force-reset
      - name: Seed E2E Database
        run: npx tsx tests/e2e/setup/e2e-seed.ts
        env:
          # DATABASE_URL is now managed by setup-ironforge to point to namespaced port
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Run Playwright Matrix Tests
        run: |
          echo "==== Running Desktop (Chromium) Tests ===="
          npx playwright test --project=desktop
          echo "==== Running Mobile Tests ===="
          npx playwright test --project=mobile
          echo "==== Running TV Tests ===="
          npx playwright test --project=tv
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'dummy_google_ai_key_for_e2e_tests' }}
      - name: "🩺 Active Handover: E2E Failure"
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'e2e'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'E2E Tests failed: Playwright test suite'
          } | ConvertTo-Json -Compress
          if ($env:N8N_WEBHOOK_URL) {
            try {
              Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck -TimeoutSec 5
              Write-Host "🩺 Dispatched E2E failure to n8n"
            } catch {
              Write-Host "⚠️ n8n dispatch failed (non-fatal): $_"
            }
          }

  # ==================================================================
  # PHASE 3: L2 (Extended Verification)
  # ==================================================================

  # E2E Smoke Tests for L2
  l2-e2e-smoke:
    name: "🎭 L2: E2E Smoke"
    needs: [l2-verification]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved] # Target specific local runner
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5437/ironforge_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5437/ironforge_test?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ironforge
        with:
          tier: 'l2'
          is-container: 'true'
      - name: Cache Playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: npx playwright install chromium
      - name: Initialize Smoke DB
        run: npx prisma db push --accept-data-loss --force-reset
      - name: Run Smoke E2E
        run: pnpm run test:smoke
      - name: "🩺 Active Handover: L2 E2E Smoke Failure"
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'l2-e2e-smoke'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'L2 E2E Smoke failed: critical user flows'
          } | ConvertTo-Json -Compress
          if ($env:N8N_WEBHOOK_URL) {
            Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck
            Write-Host "🩺 Dispatched L2 E2E Smoke failure to n8n"
          }

  # Performance Audit for L2
  l2-perf-audit:
    name: "📊 L2: Perf Audit"
    needs: [l2-verification]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved] # Target specific local runner
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ironforge_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/ironforge_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ironforge
      - name: Setup Chrome
        run: npx playwright install chrome
      - run: pnpm run build
      - name: Run Lighthouse Audit
        run: pnpm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: "🩺 Active Handover: Perf Audit Failure"
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'l2-perf-audit'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'L2 Verification failed: Lighthouse regression'
          } | ConvertTo-Json -Compress
          if ($env:N8N_WEBHOOK_URL) {
            Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck
            Write-Host "🩺 Dispatched Perf Audit failure to n8n"
          }

  # DB Guard renamed to L2: DB Guard
  l2-db-guard:
    name: "🗄️ L2: DB Guard"
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved] # Target specific local runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ironforge
        with:
          tier: 'l2'
      - name: Create Shadow Database
        shell: pwsh
        run: npx tsx scripts/ci/setup-db.ts
        env:
          TARGET_DB: ironforge_shadow
          ADMIN_DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
      - name: Verify Prisma Drift
        shell: pwsh
        run: |
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: "🩺 Active Handover: DB Guard Failure"
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          N8N_WEBHOOK_URL: ${{ env.N8N_CI_TRIAGE_WEBHOOK_URL }}
        run: |
          $payload = @{
            job_name = 'l2-db-guard'
            run_id = '${{ github.run_id }}'
            pr_number = '${{ github.event.pull_request.number }}'
            branch = '${{ github.head_ref || github.ref_name }}'
            conclusion = 'failure'
            logs_summary = 'DB Guard failed: Prisma schema drift or shadow DB error'
          } | ConvertTo-Json -Compress
          if ($env:N8N_WEBHOOK_URL) {
            Invoke-RestMethod -Uri $env:N8N_WEBHOOK_URL -Method Post -Body $payload -ContentType 'application/json' -SkipCertificateCheck
            Write-Host "🩺 Dispatched DB Guard failure to n8n"
          }

  # Automatic Deployment Trigger (L2 Success)
  deploy-verification:
    name: 🏥 Deployment Status
    needs: [l2-verification, l2-e2e-smoke, l2-db-guard, l2-perf-audit]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved] # Target specific local runner
    steps:
      - name: Verify Health
        env:
          DEPLOY_URL: ${{ secrets.PRODUCTION_URL || 'https://ironforge.life' }}
        run: |
          printf "🔍 Checking health at $DEPLOY_URL/api/health\n"
          # Wait up to 90s for Coolify deployment using a loop instead of hard sleep
          for i in {1..18}; do curl -f -s "$DEPLOY_URL/api/health" && exit 0 || sleep "5"; done; exit 1

  # ==================================================================
  # GHCR Image Registry (Docker 10/10)
  # Builds and pushes production image on main merges.
  # Enables instant rollbacks and eliminates on-server builds.
  # ==================================================================
  publish-image:
    name: 📦 Publish Docker Image
    needs: [l2-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/techlemariam/ironforge:latest
            ghcr.io/techlemariam/ironforge:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max