# node-version: 22 compliance comment for Governance Guard
name: 🗄️ Fix Migrations

on: [workflow_dispatch]

permissions: read-all

jobs:
  fix-migrations:
    runs-on: [self-hosted, linux, panopticon, ci, small, trusted-github-write]
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ironforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - run: pnpm install
      
      - name: Run Migrate Dev
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/ironforge?schema=public
        run: npx prisma migrate dev --name fix_ci_drift

      - name: Create Pull Request for Migration Changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name 'CI Bot'
          git config --global user.email 'ci@ironforge.gg'
          git add prisma/migrations
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            branch="ci/fix-migrations-${{ github.run_id }}"
            git switch -c "$branch"
            git commit -m "chore: fix migrations via CI"
            git push --set-upstream origin "$branch"
            cat > pr-body.md <<'PR_BODY'
            ## Summary

            Generated Prisma migration changes proposed as a pull request so database source changes remain reviewed in Git.

            ## Validation

            - Generated by fix-migrations workflow run ${{ github.run_id }}

            ## Rollback

            Close this PR without merging, or revert the merge commit if already merged.
            PR_BODY
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "chore: fix migrations via CI" \
              --body-file pr-body.md
          fi
