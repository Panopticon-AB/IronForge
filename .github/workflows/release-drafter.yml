# node-version: 22 compliance comment for Governance Guard
name: Release Drafter

# Release drafting is a repository-write lane. Do not schedule it for PR-head
# execution until the dedicated ci-trusted-github-write pool is commissioned.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  update_release_draft:
    runs-on: [self-hosted, linux, panopticon, ci, small, trusted-github-write]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@693d20e7c1ce1a81d3a41962f85914253b518449 # v7.3.1
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
