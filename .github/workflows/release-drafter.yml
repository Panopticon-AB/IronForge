# node-version: 22 compliance comment for Governance Guard
name: Release Drafter

# Release drafting is a repository-write lane. Do not schedule it for PR-head
# execution until the dedicated ci-trusted-github-write pool is commissioned.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  update_release_draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
