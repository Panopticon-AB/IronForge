# node-version: 22 compliance comment for Governance Guard
name: 🔧 Self-Healing Pipeline

on:
  repository_dispatch:
    types: [trigger-self-heal]

permissions: read-all

jobs:
  heal:
    runs-on: [self-hosted, linux, panopticon, ci, small, trusted-github-write]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Circuit Breaker
        if: "contains(github.event.client_payload.source, 'self-heal')"
        run: |
          echo "Self-healing loop detected! Aborting."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.branch }}
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Auto-fix Linting
        if: ${{ github.event.client_payload.failure_type == 'LINT' || github.event.client_payload.failure_type == 'UNKNOWN' }}
        run: pnpm run lint --write || true
        
      - name: Auto-fix Security
        if: ${{ github.event.client_payload.failure_type == 'SECURITY' || github.event.client_payload.failure_type == 'UNKNOWN' }}
        run: pnpm audit fix || true
        
      - name: Create Pull Request for Fixes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          git config --global user.name "CI Guardian [bot]"
          git config --global user.email "guardian@brotherhood.dev"
          git add -A -- . ':!*.log' ':!.agent/tasks/*.log'
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            branch="self-heal/${{ github.event.client_payload.failure_type }}-${{ github.run_id }}"
            git switch -c "$branch"
            git commit -m "fix: auto-remediate [${{ github.event.client_payload.failure_type }}] debt"
            git push --set-upstream origin "$branch"
            cat > pr-body.md <<'PR_BODY'
            ## Summary

            Automated self-heal changes proposed as a pull request so Git remains the reviewed source of truth.

            ## Validation

            - Generated by self-heal workflow run ${{ github.run_id }}

            ## Rollback

            Close this PR without merging, or revert the merge commit if already merged.
            PR_BODY
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "fix: auto-remediate ${{ github.event.client_payload.failure_type }} debt" \
              --body-file pr-body.md
          fi
