# node-version: 22 compliance comment for Governance Guard
name: PR Public Smoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, release, fix/*, feat/*, 'ci/**', 'agent/**', 'security/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - '.vscode/**'

concurrency:
  group: pr-public-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-smoke:
    name: '🧪 PR Public Smoke (base-controlled)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      IRONFORGE_E2E_SKIP_GLOBAL_SETUP: 'true'
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ironforge_test?schema=public
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/ironforge_test?schema=public
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      SKIP_ENV_VALIDATION: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ironforge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js without package-manager cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate repository pnpm version
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Install dependencies without shared cache
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public critical-path smoke
        run: pnpm exec playwright test tests/e2e/critical-path.spec.ts --project=smoke
