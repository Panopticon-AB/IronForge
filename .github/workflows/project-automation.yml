# node-version: 22 compliance comment for Governance Guard
name: Project Automation

on:
  issues:
    types: [closed, reopened]
  pull_request:
    types: [opened, closed]

# GitHub Project V2 Configuration
# IDs are stored in .agent/config/github-project.json
# These env vars provide a fallback for GitHub Actions context
env:
  PROJECT_ID: PVT_kwHOAe3KCM4BMt-p
  STATUS_FIELD_ID: PVTSSF_lAHOAe3KCM4BMt-pzg76_fI
  STATUS_BACKLOG: f75ad846
  STATUS_IN_PROGRESS: 47fc9ee4
  STATUS_IN_REVIEW: 881f842c
  STATUS_MERGED_STAGING: 3ac5a295
  STATUS_DONE: 98236657

permissions:
  contents: read

jobs:
  update_project:
    name: Best-effort Project V2 sync
    runs-on: [self-hosted, linux, panopticon, ci, small, trusted-github-write]
    timeout-minutes: 5
    # Skip for Dependabot PRs — Dependabot cannot receive repository secrets.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read

    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dedicated project token
        id: project_token
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "PROJECT_TOKEN is not configured. Project V2 sync is degraded."
          }

      # ===== ISSUE EVENTS =====

      - name: Move Closed Issue to Done
        id: close_issue
        continue-on-error: true
        if: steps.project_token.outcome == 'success' && github.event_name == 'issues' && github.event.action == 'closed'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          .agent/scripts/link-issue-to-project.ps1 `
            -IssueNumber ${{ github.event.issue.number }} `
            -Status "done" `
            -Verbose

      - name: Move Reopened Issue to In Progress
        id: reopen_issue
        continue-on-error: true
        if: steps.project_token.outcome == 'success' && github.event_name == 'issues' && github.event.action == 'reopened'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          .agent/scripts/link-issue-to-project.ps1 `
            -IssueNumber ${{ github.event.issue.number }} `
            -Status "in_progress" `
            -Verbose

      # ===== PULL REQUEST EVENTS =====

      - name: Link PR to Project on Open
        id: open_pr
        continue-on-error: true
        if: steps.project_token.outcome == 'success' && github.event_name == 'pull_request' && github.event.action == 'opened'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          .agent/scripts/link-pr-to-project.ps1 `
            -PRNumber ${{ github.event.pull_request.number }} `
            -Status "in_review" `
            -Verbose

      - name: Move Merged PR to Done
        id: merge_pr
        continue-on-error: true
        if: steps.project_token.outcome == 'success' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          .agent/scripts/link-pr-to-project.ps1 `
            -PRNumber ${{ github.event.pull_request.number }} `
            -Status "done" `
            -Verbose

      - name: Move Closed PR to Backlog
        id: close_pr
        continue-on-error: true
        if: steps.project_token.outcome == 'success' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          .agent/scripts/link-pr-to-project.ps1 `
            -PRNumber ${{ github.event.pull_request.number }} `
            -Status "backlog" `
            -Verbose

      - name: Report degraded project synchronization
        if: always() && (steps.project_token.outcome == 'failure' || steps.close_issue.outcome == 'failure' || steps.reopen_issue.outcome == 'failure' || steps.open_pr.outcome == 'failure' || steps.merge_pr.outcome == 'failure' || steps.close_pr.outcome == 'failure')
        shell: bash
        run: |
          {
            echo "### ⚠️ Project Automation degraded"
            echo
            echo "The repository event completed, but Project V2 synchronization did not."
            echo "Inspect the failed step and verify the dedicated PROJECT_TOKEN permissions."
            echo "This auxiliary automation is intentionally non-blocking for code merges."
          } >> "$GITHUB_STEP_SUMMARY"
