# node-version: 22 compliance comment for Governance Guard
name: 🤖 Jules PR Auto-QA

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main, develop]

concurrency:
  group: jules-qa-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  qa-gate:
    name: 🧪 Jules QA Gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'jules/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup IronForge
        uses: ./.github/actions/setup-ironforge
        with:
          skip-managed-services: 'true'
          skip-validation: 'true'

      - name: 🔒 Scope Guard — Verify Jules stayed in bounds
        run: |
          echo "## 🔒 Scope Guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          CHANGED=$(git diff --name-only origin/main...HEAD)

          FORBIDDEN_PATTERNS=(
            "prisma/migrations"
            ".github/workflows"
            "src/lib/auth"
            "src/app/api/auth"
            "docker-compose"
            "Dockerfile"
            ".env"
            "secrets"
          )

          VIOLATIONS=""
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(echo "$CHANGED" | grep -i "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n- ❌ \`$pattern\`: $MATCHES"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "### ❌ Scope Violations Found" >> "$GITHUB_STEP_SUMMARY"
            echo -e "$VIOLATIONS" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Jules modified forbidden files. Manual review required."
            exit 1
          fi

          echo "### ✅ All changes within allowed scope" >> "$GITHUB_STEP_SUMMARY"

          FILE_COUNT=$(echo "$CHANGED" | wc -l)
          if [ "$FILE_COUNT" -gt 10 ]; then
            echo "::warning::Jules modified $FILE_COUNT files (threshold: 10). Review carefully."
            echo "- ⚠️ $FILE_COUNT files modified (threshold: 10)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ $FILE_COUNT files modified (within threshold)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🧹 Lint Check
        run: npm run lint -- --max-warnings 0
        continue-on-error: true

      - name: 🔍 Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 🧪 Run Tests
        run: npm test -- --passWithNoTests --ci
        continue-on-error: true

      - name: 📋 QA Summary
        if: always()
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🤖 Jules Auto-QA Report"
            echo ""
            echo "| Check | Status |"
            echo "|:------|:-------|"
            echo "| QA gate | $JOB_STATUS |"
            echo ""
            echo "> Branch: \`$BRANCH\`"
            echo ""
            echo "Read-only PR validation: this job does not comment, label, merge, deploy, or mutate GitHub state."
          } >> "$GITHUB_STEP_SUMMARY"
