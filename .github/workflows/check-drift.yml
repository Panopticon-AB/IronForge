# node-version: 22 compliance comment for Governance Guard
name: 🔍 Check Drift
on: [workflow_dispatch]

permissions: read-all

jobs:
  check-drift:
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ironforge
        with:
          tier: L2
      - name: DB Pull
        run: npx prisma db pull
      - name: Show Drift
        run: git diff prisma/schema.prisma
      - name: Cleanup
        run: git checkout prisma/schema.prisma
