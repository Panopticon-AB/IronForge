# node-version: 22 compliance comment for Governance Guard
name: 🌐 Synthetic Monitoring
on:
  schedule:
    - cron: '0 */4 * * *' # Run every 4 hours
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  synthetic-check:
    name: 🏥 Prod Health Check
    runs-on: [self-hosted, linux, panopticon, ci, small, live-approved]
    permissions:
      contents: read
      issues: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup IronForge
        uses: ./.github/actions/setup-ironforge
        with:
          skip-managed-services: true
          skip-validation: true

      - name: Run Synthetic Test
        env:
          # Use production URL from secrets, or default to main site
          BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://ironforge.gg' }}
          CI: true
        run: |
          echo "Running synthetic check against $BASE_URL"
          # Run specifically the landing page test or a dedicated synthetic spec
          # Overriding the baseURL in playwright config via env var or CLI arg would be ideal,
          # but for now we assume the test can adapt or we just check basic reachability.
          
          # Creating a temporary synthetic test on the fly if one doesn't exist designed for prod
          echo "import { test, expect } from '@playwright/test';
          
          test('Synthetic Health Check', async ({ page }) => {
            const response = await page.goto('$BASE_URL');
            expect(response.status()).toBe(200);
            await expect(page).toHaveTitle(/IronForge/i);
          });" > tests/e2e/synthetic.spec.ts

          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/synthetic.spec.ts --project=smoke
        
      - name: 🚨 Notify on Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const title = '🚨 Synthetic Monitor Failed';
            // Dedup: check if an open issue with this title already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'critical,ops',
              per_page: 10,
            });
            const alreadyOpen = existing.data.some(i => i.title === title);
            if (alreadyOpen) {
              console.log('⏩ Issue already open — skipping duplicate creation');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The synthetic health check failed against production.\n\n[View Run Log](${runUrl})`,
              labels: ['critical', 'ops']
            });
