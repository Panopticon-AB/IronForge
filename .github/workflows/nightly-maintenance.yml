# =============================================================================
# NIGHTLY MAINTENANCE WORKFLOW
# =============================================================================
# Autonomous nightly maintenance triggered by cron or default-branch dispatch.
# Integrates with Antigravity Auto Wake-up configuration.
#
# Schedule: Monday, Wednesday, Friday at 02:00 CET (01:00 UTC)
# =============================================================================

# node-version: 22 compliance comment for Governance Guard
name: 🌙 Nightly Maintenance

on:
  schedule:
    # 01:00 UTC = 02:00 CET (Europe/Stockholm)
    - cron: "0 1 * * 1,3,5"
  repository_dispatch:
    types: [nightly-maintenance]

permissions: read-all

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ===========================================================================
  # PRE-FLIGHT CHECKS
  # ===========================================================================
  preflight:
    name: 🛫 Pre-flight Checks
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      workflow: ${{ steps.check.outputs.workflow }}
      dry_run: ${{ steps.check.outputs.dry_run }}
      skip_pr: ${{ steps.check.outputs.skip_pr }}
    steps:
      - name: Check conditions
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.info('📋 Checking pre-flight conditions...');

            const allowedWorkflows = new Set([
              '/night-shift',
              '/health-check',
              '/monitor-debt',
              '/evolve',
            ]);
            const payload = context.payload.client_payload || {};
            const requestedWorkflow =
              context.eventName === 'repository_dispatch'
                ? payload.workflow || '/night-shift'
                : '/night-shift';

            if (!allowedWorkflows.has(requestedWorkflow)) {
              throw new Error(`Unsupported maintenance workflow: ${requestedWorkflow}`);
            }

            const parseBoolean = (value, fallback) => {
              if (typeof value === 'boolean') return value;
              if (value === 'true') return true;
              if (value === 'false') return false;
              return fallback;
            };
            // Manual/API dispatch defaults to dry-run. A mutating dispatch must
            // explicitly send { "dry_run": false } in client_payload.
            const dryRun =
              context.eventName === 'repository_dispatch'
                ? parseBoolean(payload.dry_run, true)
                : false;
            const skipPr =
              context.eventName === 'repository_dispatch'
                ? parseBoolean(payload.skip_pr, false)
                : false;

            core.setOutput('workflow', requestedWorkflow);
            core.setOutput('dry_run', String(dryRun));
            core.setOutput('skip_pr', String(skipPr));
            core.info(
              `Requested workflow=${requestedWorkflow}, dry_run=${dryRun}, skip_pr=${skipPr}`
            );

            // Keep the workflow idempotent without depending on gh being installed.
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const openNightShiftPulls = openPulls.filter((pull) =>
              (pull.labels || []).some((label) => label.name === 'night-shift')
            );

            if (openNightShiftPulls.length > 0) {
              core.info(`⚠️ Found ${openNightShiftPulls.length} open night-shift PR(s), skipping...`);
              core.setOutput('should_run', 'false');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-cd.yml',
              branch: 'main',
              per_page: 1,
            });
            const lastConclusion = runs.data.workflow_runs[0]?.conclusion || 'unknown';

            if (lastConclusion !== 'success') {
              core.info(`⚠️ Last CI run was not successful (${lastConclusion}), skipping...`);
              core.setOutput('should_run', 'false');
              return;
            }

            core.info('✅ All pre-flight checks passed');
            core.setOutput('should_run', 'true');

  # ===========================================================================
  # MAINTENANCE TASKS
  # ===========================================================================
  maintenance:
    name: 🔧 Run Maintenance
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      contents: write
    container:
      image: ghcr.io/techlemariam/ironforge/ironforge-agent:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      changes_made: ${{ steps.changes.outputs.changes_detected }}
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup IronForge
        uses: ./.github/actions/setup-ironforge
        with:
          is-container: 'true'

      - name: Create maintenance branch
        run: |
          BRANCH="night-shift/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # TASK 1: Dependency Security Audit
      # -----------------------------------------------------------------------
      - name: "🛡️ L3: Dependency Audit"
        id: security
        continue-on-error: true
        run: |
          echo "## 🛡️ Dependency Security Audit" >> $GITHUB_STEP_SUMMARY
          pnpm run security 2>&1 | tee security-output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Dependency audit passed" >> $GITHUB_STEP_SUMMARY
            echo "security_clean=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Dependency vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "security_clean=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # TASK 2: Dependency Evolution (/evolve)
      # -----------------------------------------------------------------------
      - name: "🧬 L3: Dependency Evolution"
        id: evolve
        continue-on-error: true
        run: |
          echo "## 🧬 Dependency Evolution" >> $GITHUB_STEP_SUMMARY

          # Update dependencies during scheduled maintenance or an explicit /evolve run.
          if [ "${{ needs.preflight.outputs.workflow }}" = "/evolve" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Running dependency evolution..."
            set +e
            pnpm update --latest 2>&1 | tee update-output.txt
            UPDATE_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$UPDATE_STATUS" -ne 0 ]; then
              echo "❌ Dependency update failed" >> $GITHUB_STEP_SUMMARY
              exit "$UPDATE_STATUS"
            fi

            if git diff --quiet package.json pnpm-lock.yaml; then
              echo "✅ No dependency updates available" >> $GITHUB_STEP_SUMMARY
              echo "deps_updated=false" >> $GITHUB_OUTPUT
            else
              echo "📦 Dependencies updated" >> $GITHUB_STEP_SUMMARY
              echo "deps_updated=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Skipping full update"
            echo "deps_updated=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # TASK 3: Exhaustive E2E Verification
      # -----------------------------------------------------------------------
      - name: "🎭 L3: Exhaustive E2E"
        id: e2e
        continue-on-error: true
        run: |
          echo "## 🎭 Exhaustive E2E" >> $GITHUB_STEP_SUMMARY
          pnpm run test:exhaustive 2>&1 | tee e2e-output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Exhaustive E2E passed" >> $GITHUB_STEP_SUMMARY
            echo "e2e_clean=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Exhaustive E2E failed" >> $GITHUB_STEP_SUMMARY
            echo "e2e_clean=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # TASK 4: Quality Checks (L3 specific)
      # -----------------------------------------------------------------------
      - name: "🔍 L3: Quality Audit"
        id: quality
        run: |
          echo "## 🔍 L3 Quality Audit" >> $GITHUB_STEP_SUMMARY
          pnpm run ci:l3
          echo "✅ L3 Quality Audit complete" >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # TASK 5: Generate Summary
      # -----------------------------------------------------------------------
      - name: 📋 Generate Summary
        id: summary
        run: |
          SUMMARY=$(cat << 'EOF'
          ## 🌙 L3 Assurance Summary

          | Task | Status |
          |:-----|:-------|
          | Dependency Audit | ${{ steps.security.outputs.security_clean == 'true' && '✅ Clean' || '⚠️ Vulnerabilities' }} |
          | Dependencies | ${{ steps.evolve.outputs.deps_updated == 'true' && '📦 Evolved' || '✅ Stable' }} |
          | Exhaustive E2E | ${{ steps.e2e.outputs.e2e_clean == 'true' && '✅ Passed' || '❌ Failed' }} |

          **Tier:** L3 (Deep Assurance)
          **Run Time:** $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
          )

          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 💾 Commit Changes
        id: changes
        if: >-
          needs.preflight.outputs.dry_run != 'true' &&
          steps.evolve.outputs.deps_updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: nightly maintenance updates [skip ci]"
          branch: ${{ env.BRANCH }}
          file_pattern: 'package.json pnpm-lock.yaml'
          skip_dirty_check: false
          create_branch: true

  # ===========================================================================
  # CREATE PR
  # ===========================================================================
  create-pr:
    name: 📬 Create PR
    needs: [preflight, maintenance]
    if: |
      needs.maintenance.outputs.changes_made == 'true' &&
      needs.preflight.outputs.skip_pr != 'true'
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Create Pull Request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NIGHT_SHIFT_SUMMARY: ${{ needs.maintenance.outputs.summary }}
        with:
          script: |
            const branch = `night-shift/${new Date().toISOString().split('T')[0]}`;
            const head = `${context.repo.owner}:${branch}`;

            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              per_page: 10,
            });
            if (existing.data.length > 0) {
              core.info(`Night-shift PR already exists: #${existing.data[0].number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: branch,
              title: `🌙 Night Shift: ${new Date().toISOString().split('T')[0]}`,
              body: process.env.NIGHT_SHIFT_SUMMARY || 'Automated nightly maintenance.',
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: created.data.number,
              labels: ['night-shift', 'automated'],
            });
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: created.data.number,
              assignees: [context.repo.owner],
            });

  # ===========================================================================
  # FAILURE NOTIFICATION
  # ===========================================================================
  notify-failure:
    name: 🚨 Notify Failure
    needs: [preflight, maintenance]
    if: failure()
    runs-on: [self-hosted, linux, panopticon, ci, small]
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `🌙 Night Shift Failed: ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## Night Shift Workflow Failed

            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Time:** ${new Date().toISOString()}

            Please investigate and fix any issues.

            /cc @${context.repo.owner}
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['night-shift', 'bug', 'automated']
            });
